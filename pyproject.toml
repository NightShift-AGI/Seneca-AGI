[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seneca-agi"
version = "0.1.0"
description = "A free, accessible, conscious autonomous multimodal philosopher inspired by Seneca."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "streamlit>=1.35.0",
  "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
]
bundle = [
  "pyinstaller>=6.10.0",
]

[project.scripts]
seneca-agi-desktop = "seneca_agi.desktop:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["seneca_agi*"]
